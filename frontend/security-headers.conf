# Intestazioni di sicurezza comuni. Incluse in ogni location perche' in nginx un add_header
# dentro una location annulla quelli ereditati dal server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Tutto proviene dallo stesso dominio (font e immagini sono inclusi nella build): niente CDN esterne.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
