<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="32" fill="#241209" />

  <!-- fumo -->
  <path
    d="M15 30c-6 4-6 10 0 14s6 10 0 14"
    fill="none"
    stroke="#f3e9d8"
    stroke-opacity="0.9"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <path
    d="M20 24c-5 4-5 9 0 13"
    fill="none"
    stroke="#f3e9d8"
    stroke-opacity="0.7"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- corpo del sigaro, diagonale dalla brace (basso-sx) alla testa (alto-dx) -->
  <g transform="rotate(-32 32 34)">
    <rect x="14" y="27" width="38" height="13" rx="6.5" fill="#8a5a2b" />
    <rect x="14" y="27" width="38" height="13" rx="6.5" fill="#000" opacity="0.06" />

    <!-- brace -->
    <rect x="12" y="28.6" width="7" height="9.8" rx="3.4" fill="#3a2c22" />
    <circle cx="14.5" cy="33.5" r="3.1" fill="#e2662d" />
    <circle cx="13.6" cy="33.5" r="1.4" fill="#f6b04b" />

    <!-- fascia -->
    <rect x="33" y="25.2" width="11.5" height="16.6" rx="2" fill="#c8451f" />
    <rect x="33" y="25.2" width="11.5" height="16.6" rx="2" fill="none" stroke="#e9c46a" stroke-width="1.3" />
    <circle cx="38.7" cy="33.5" r="4.6" fill="none" stroke="#e9c46a" stroke-width="1" stroke-dasharray="1.4 1.4" />
    <path
      d="M38.7 30.6l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z"
      fill="#e9c46a"
    />
  </g>
</svg>
